# Production ML platform stack — thin entrypoint that merges the per-service
# compose fragments under infra/<service>/compose.yml. Every service owns its
# own folder (config + compose), senior-monorepo style. Usage:
#   docker compose up -d              # brings up all services
#   docker compose up -d spark-master  # or target one service
#
# Services:
#   postgres  OLTP catalog + metadata            infra/postgres
#   clickhouse  OLAP warehouse (quant BRONZE)     infra/clickhouse
#   redis     online store / cache                infra/redis
#   minio     S3-compatible object storage        infra/minio
#   mlflow    model registry (PG + MinIO)         infra/mlflow
#   qdrant    vector DB                           infra/qdrant
#   spark     standalone cluster (master+worker)  infra/spark
#   prefect   batch orchestration (3.8.1)         infra/prefect
#   kafka     event backbone (legacy pillars;     infra/kafka
#             NOT started by default — host :9092
#             belongs to quant_signal's Redpanda)
#   prometheus  metrics                           infra/prometheus
#   grafana     dashboards (+ ClickHouse ds)      infra/grafana
#   loki        logs                              infra/loki
#   jaeger      tracing                          infra/jaeger
#   localstack  AWS emulation                     infra/localstack
#
# The quant_signal live streaming stack (Redpanda + Redis + Flink) is a
# separate, self-contained project: quant_signal/docker-compose.yml.

include:
  - infra/postgres/compose.yml
  - infra/clickhouse/compose.yml
  - infra/redis/compose.yml
  - infra/minio/compose.yml
  - infra/mlflow/compose.yml
  - infra/qdrant/compose.yml
  - infra/spark/compose.yml
  - infra/prefect/compose.yml
  - infra/kafka/compose.yml
  - infra/prometheus/compose.yml
  - infra/grafana/compose.yml
  - infra/loki/compose.yml
  - infra/jaeger/compose.yml
  - infra/localstack/compose.yml
