name: CI

on:
  push:
    branches: [main, master]
    # The root project is the legacy mlops-academy learning stack. Scope CI to
    # its own paths so quant_signal pushes don't run (and fail) this job.
    paths:
      - "fraud_detection/**"
      - "demand_forecasting/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "fraud_detection/**"
      - "demand_forecasting/**"
      - "shared/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q --tb=short
