[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-signal"
version = "0.1.0"
description = "Production-grade quant signal platform: Snowflake-backed pipelines with Spark, data quality, and full observability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # secure-local-storage (keyring) enables MFA token caching on macOS.
    "snowflake-connector-python[pandas,secure-local-storage]>=4.7.1",
    "pandas>=2.2.0",
    "pyarrow>=19.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "prefect>=2.19.0",
    "requests>=2.34.2",
    "curl-cffi>=0.16.0",
    "confluent-kafka>=2.5.0",
    "redis>=5.0.0",
    "river>=0.23.0",
    "pybit>=5.8.0",
    # Batch warehouse sink for the streaming online store (Redis -> ClickHouse
    # materialization). clickhouse-connect is the current official client
    # (clickhouse-driver is legacy). Used by flows/materialize_clickhouse.py.
    "clickhouse-connect>=0.8.0",
    "ccxt>=4.5.64",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.9.0,<2.0.0",
    "dbt-snowflake>=1.9.0,<2.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
# Snowpark: run the SAME feature UDF INSIDE the warehouse instead of pulling
# rows out to a local JVM. Removes the Java dependency, the spark-snowflake
# connector JAR, and the egress -- the compute moves to the data rather than
# the data to the compute.
snowpark = [
    "snowflake-snowpark-python[pandas]>=1.20.0",
]
# Spark feature-engineering batch over BRONZE (flows/feature_engineering.py).
# Optional: the pandas fallback path runs without it (and without Java).
spark = [
    "pyspark>=3.5.0",
]
# Experiment tracking (MLflow) for offline validation runs — the served models
# are online learners (River) + MC, so only *tracking* is used, not the model
# registry. Optional: without it, tracking is a no-op.
mlflow = [
    "mlflow>=2.14.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]
lake = [
    "pyiceberg[pyarrow,s3fs,sql-sqlite]>=0.11.1",
    # Embedded OLAP for local, serverless verification of the Iceberg lake
    # (recompute the FAS+SMB Sharpe from gold.features without Snowflake).
    "duckdb>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "db*", "ingest*", "flows*", "api*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Exploratory research scripts are held to a looser standard than the production
# path and the paper's replication set, both of which are fully clean. These are
# one-off probes: long formula lines, throwaway intermediates and compact
# statements are the point, and reformatting them would obscure what was tried.
# Correctness rules (F821 undefined name, F811 redefinition) still apply.
[tool.ruff.lint.per-file-ignores]
"scripts/probes/*.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/audit_cache.py" = ["E501", "F841"]
"scripts/backfill_*.py" = ["E501"]
"scripts/harness_verify.py" = ["E501"]
"scripts/lake_sharpe_verify.py" = ["E501"]
"scripts/pull_*.py" = ["E501"]
"scripts/replay_*.py" = ["E501", "E402", "F841"]
"scripts/research_*.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/alpha101.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/factor_ic.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/null_test.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/perm_test_research.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/walk_forward.py" = ["E501", "E701", "E702", "E741", "F841"]
"scripts/backfill/*.py" = ["E501", "E701", "E702", "E741", "F841"]
"research/code/**/*.py" = ["E501", "E701", "E702", "E741", "F841", "E402", "F601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
