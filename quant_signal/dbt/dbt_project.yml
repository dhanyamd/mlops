name: quant_signal
version: "1.0.0"
config-version: 2

# Fail fast if the installed dbt version drifts outside this range.
require-dbt-version: [">=1.9.0", "<2.0.0"]

profile: quant_signal

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  quant_signal:
    +materialized: view
    silver:
      +schema: silver
      +materialized: table
      # Every silver/gold model MUST declare a full column contract or the
      # build fails — this is the "quality gate" in the platform.
      +contract:
        enforced: true
    gold:
      +schema: gold
      +materialized: table
      +contract:
        enforced: true
