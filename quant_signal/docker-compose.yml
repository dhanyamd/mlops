services:
  redpanda:
    image: redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAIN://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr PLAIN://localhost:9092,PLAINTEXT://redpanda:29092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flink-jobmanager:
    build: ./stream/flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      redpanda:
        condition: service_healthy

  flink-taskmanager:
    build: ./stream/flink
    command: taskmanager
    scale: 1
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_started

volumes:
  flink-checkpoints:
