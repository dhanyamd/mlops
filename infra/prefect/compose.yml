# Prefect — batch orchestration server.
# Pinned to Prefect 3.8.1 so the server API matches the local venv client
# (prefect 3.8.1). The previous image was 2.19 — Prefect 3 changed the REST
# API, and a 3.x client cannot talk to a 2.x server.

services:
  prefect:
    image: prefecthq/prefect:3.8.1-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect

volumes:
  prefect_data:
