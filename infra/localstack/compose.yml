# LocalStack — AWS emulation (S3, SQS, ECR, Secrets Manager) for the cloud
# deployment path (infra/terraform + infra/scripts/init_localstack.sh).

services:
  localstack:
    image: localstack/localstack:3.5
    ports:
      - "4566:4566"         # All AWS service APIs (S3, SQS, ECR, Secrets Manager)
    environment:
      SERVICES: s3,sqs,secretsmanager,iam,cloudwatch
      DEBUG: "0"
      PERSISTENCE: "1"      # State survives container restart
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  localstack_data:
