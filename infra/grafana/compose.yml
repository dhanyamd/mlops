# Grafana — dashboards (auto-provisioned from ./provisioning + ./dashboards).
# Base image ships Prometheus + Loki datasources only; GF_INSTALL_PLUGINS
# downloads the ClickHouse datasource plugin at first start.

services:
  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"   # 3000 on the host belongs to the Next.js Signal Terminal
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ml_model_health.json
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # Feed the ClickHouse password into the container so the provisioning
      # datasources.yml can expand $__env{CLICKHOUSE_PASSWORD}. Grafana's env
      # interpolation does NOT support shell-style ${VAR:-default} defaults, so
      # the default lives in compose interpolation instead.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-mlops}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grafana_data:
